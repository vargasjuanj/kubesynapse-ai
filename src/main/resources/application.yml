server:
  port: 8080

spring:
  application:
    name: kube-cka-ai-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:h2:file:./data/kubedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/kubesynapse_cka}
      auto-index-creation: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

kubesynapse:
  cluster:
    default-namespace: default
    diagnostic:
      tail-log-lines: 100
  ai:
    provider: ollama
    timeout-seconds: 12
    ollama:
      base-url: http://localhost:11434
      model: qwen3:8b
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:mock-key}
      model: gpt-4o-mini
  messaging:
    rabbitmq:
      enabled: true
      consumer:
        enabled: false
    outbox:
      relay-interval-ms: 15000
