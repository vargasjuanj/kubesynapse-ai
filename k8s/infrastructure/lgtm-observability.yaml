apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm-observability
  namespace: default
  labels:
    app: lgtm
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
        tier: observability
    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grafana-ui
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 9090
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: default
  labels:
    app: lgtm
spec:
  type: NodePort
  selector:
    app: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
      nodePort: 31300
    - name: otel-grpc
      port: 4317
      targetPort: 4317
      nodePort: 31317
    - name: otel-http
      port: 4318
      targetPort: 4318
      nodePort: 31318
    - name: prometheus
      port: 9090
      targetPort: 9090
      nodePort: 31090
