apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-cka-alert-service
  namespace: default
  labels:
    app: alert-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-service
  template:
    metadata:
      labels:
        app: alert-service
    spec:
      containers:
      - name: alert-service
        image: eclipse-temurin:21-jre-alpine
        command: ["java", "-jar", "/app/alert-service.jar"]
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: SPRING_RABBITMQ_PORT
          value: "5672"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: default
  labels:
    app: alert-service
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
  selector:
    app: alert-service
