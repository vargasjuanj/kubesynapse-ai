apiVersion: v1
kind: Pod
metadata:
  name: demo-oomkilled-service
  namespace: default
  labels:
    app: demo-oomkilled
    tier: worker
spec:
  containers:
    - name: memory-eater
      image: polinux/stress
      resources:
        limits:
          memory: "32Mi"
        requests:
          memory: "16Mi"
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "64M", "--vm-hang", "1"]
  restartPolicy: Always
