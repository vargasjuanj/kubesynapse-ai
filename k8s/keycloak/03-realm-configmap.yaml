apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: keycloak
  labels:
    app: keycloak
data:
  kubesynapse-realm.json: |
    {
      "realm": "kubesynapse",
      "enabled": true,
      "displayName": "KubeCKA-AI-Agent Security Realm",
      "sslRequired": "none",
      "registrationAllowed": false,
      "resetPasswordAllowed": false,
      "roles": {
        "realm": [
          {
            "name": "ROLE_ADMIN",
            "description": "Full SRE Cluster Administrator - Can mutate, remediate, and inject chaos"
          },
          {
            "name": "ROLE_OPERATOR",
            "description": "Observability and Triage Operator - Read-only diagnostics and verification"
          }
        ]
      },
      "clients": [
        {
          "clientId": "kubesynapse-client",
          "name": "KubeCKA Frontend & Backend API Client",
          "enabled": true,
          "publicClient": true,
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        }
      ],
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@kubesynapse.io",
          "firstName": "SRE",
          "lastName": "Administrator",
          "credentials": [
            {
              "type": "password",
              "value": "admin123",
              "temporary": false
            }
          ],
          "realmRoles": ["ROLE_ADMIN", "ROLE_OPERATOR"]
        },
        {
          "username": "operator",
          "enabled": true,
          "email": "operator@kubesynapse.io",
          "firstName": "Cloud",
          "lastName": "Operator",
          "credentials": [
            {
              "type": "password",
              "value": "operator123",
              "temporary": false
            }
          ],
          "realmRoles": ["ROLE_OPERATOR"]
        }
      ]
    }
